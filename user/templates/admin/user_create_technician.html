{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Crear Técnico</h1>

  {% if messages %}
    <ul class="messagelist">
      {% for m in messages %}
        <li class="{{ m.tags }}">{{ m }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div>
      <label>Email</label><br>
      <input type="email" name="email" style="width:320px;padding:6px;margin-bottom:8px" required />
    </div>

    <div>
      <label>Nombre</label><br>
      <input type="text" name="first_name" style="width:320px;padding:6px;margin-bottom:8px" />
    </div>

    <div>
      <label>Apellido</label><br>
      <input type="text" name="last_name" style="width:320px;padding:6px;margin-bottom:8px" />
    </div>

    <div>
      <label>Departamento (opcional)</label><br>
      <select name="department" style="width:320px;padding:6px;margin-bottom:8px">
        <option value="">-- Ninguno --</option>
        {% for d in departments %}
          <option value="{{ d.id }}">{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="default">Crear técnico</button>
    <a href="{{ admin_site.index_url }}" style="margin-left:10px">Cancelar</a>
  </form>

{% endblock %}
